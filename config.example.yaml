# Select a Gemini Developer API model after evaluating it on your corpus.
model: "gemini-3.7-flash"
audience: New customers
language: English
scope: All supplied specifications describe available functionality
style: Clear connected prose, explicit prerequisites, no marketing promises
glossary: {}
temperature: 1.0
batch_chars: 16000
context_chars: 100000
max_output_tokens: 8192
max_calls: 200
token_budget: 2000000
retries: 2
repair_attempts: 2
timeout_seconds: 120
min_call_interval: 0
customer_evidence: false
# Optional absolute paths if Mermaid CLI or the browser are not discoverable.
mermaid_cli: ""
browser_executable: ""
