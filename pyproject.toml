[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docgen-graph"
version = "0.1.0"
description = "Source-grounded documentation with graph retrieval and human review"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.50,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.0,<2",
  "pillow>=11,<13",
  "defusedxml>=0.7,<1",
  "markdown-it-py>=3,<5",
  "pypdf>=5,<7",
  "openpyxl>=3.1,<4",
]

[project.scripts]
docgen = "docgen_graph.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/docgen_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
