[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "legacy-docgen"
version = "0.1.0"
description = "Evidence-backed documentation from legacy Markdown"
requires-python = ">=3.12"
dependencies = [
  "langchain-google-genai>=4,<5",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "markdown-it-py>=4,<5",
  "mdit-py-plugins>=0.5,<0.7",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "typer>=0.16,<1",
  "pillow>=11,<13",
  "filelock>=3.18,<4",
]

[project.scripts]
docgen = "docgen.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.16,<2", "types-PyYAML>=6", "build>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/docgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in Gemini evaluation requiring credentials"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/docgen"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

