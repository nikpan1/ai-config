# Bounded full-corpus evaluation. Credentials remain in the environment.
model: gemini-3.7-flash
batch_chars: 16000
reconcile_chars: 48000
context_chars: 160000
max_output_tokens: 32768
max_calls: 400
token_budget: 8000000
timeout_seconds: 300
min_call_interval: 1
browser_executable: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
