<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-__SCRIPT_HASH__'; style-src 'sha256-__STYLE_HASH__'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>Documentation run inspector</title>
    <style>__STYLE__</style>
  </head>
  <body>
    <header>
      <div>
        <span class="eyebrow">DOCGEN / INDEPENDENT INSPECTION</span>
        <h1>Documentation run inspector</h1>
        <p id="identity"></p>
      </div>
      <div id="capture"></div>
    </header>
    <nav aria-label="Views">
      <button data-view="graph">Graph</button
      ><button data-view="run">Run</button
      ><button data-view="content">Content</button
      ><button data-view="quality">Quality</button>
    </nav>
    <main>
      <section id="workspace">
        <div id="controls"></div>
        <div id="summary" role="status"></div>
        <div id="visual"></div>
        <div id="listing"></div>
      </section>
      <aside>
        <h2 id="detail-title">Details</h2>
        <div id="detail"></div>
      </aside>
    </main>
    <footer>
      Offline captured export · Re-export to refresh · Source content is shown
      as inert text · Stored graph edges and derived trace links remain separate
    </footer>
    <div id="dataset" hidden>__DATA__</div>
    <script>__SCRIPT__</script>
  </body>
</html>
