<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge review</title>
  <link rel="stylesheet" href="graph.css">
</head>
<body>
  <header><h1>Knowledge review</h1><span id="counts"></span></header>
  <nav aria-label="Graph filters">
    <label>Search<input id="search" type="search" placeholder="Entity or alias"></label>
    <label>Capability<select id="capability"><option value="">All capabilities</option></select></label>
    <label>Status<select id="status"><option value="">All statuses</option><option>candidate</option><option>accepted</option><option>unresolved</option><option>rejected</option></select></label>
    <button id="fit" title="Fit graph" aria-label="Fit graph">&#x26F6;</button>
    <button id="reset" title="Reset selection" aria-label="Reset selection">&#x21BA;</button>
  </nav>
  <main><section class="graph"><div id="network" aria-label="Knowledge graph"></div><div id="legend"></div><p id="empty" hidden>No matching entities</p></section><aside id="details"><h2>Evidence</h2><p id="selection">No entity selected</p></aside></main>
  <script id="graph-data" type="application/json">__GRAPH_DATA__</script>
  <script src="vis-network.min.js"></script>
  <script src="graph.js"></script>
</body>
</html>
