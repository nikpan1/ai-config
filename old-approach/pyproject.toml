[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-gen"
version = "0.1.0"
description = "Resumable, evidence-preserving Markdown knowledge pipeline"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.50,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "markdown-it-py>=4.0,<5",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "filelock>=3.20,<4",
  "httpx>=0.28,<1",
]

[project.scripts]
docgen = "docgen.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/docgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
